<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Matrix — Neo Terminal</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: transparent; color: #00ff41; font-family: "Consolas", "Courier New", monospace; overflow: hidden; }
  #stage { position: fixed; inset: 0; background: transparent; }
  #rain { position: absolute; inset: 0; z-index: 0; }
  #boot { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: #000; transition: opacity 0.8s ease; z-index: 10; }
  #boot.fade { opacity: 0; pointer-events: none; }
  .blocks { position: relative; width: 260px; height: 260px; }
  .block { position: absolute; width: 58px; height: 58px; opacity: 0; transform: scale(0.2); animation: appear 1s ease-out forwards; }
  .b1 { background: #0055aa; top: 0; left: 0; animation-delay: 0.1s; }
  .b2 { background: #cc2222; top: 0; right: 0; animation-delay: 0.3s; }
  .b3 { background: #22aa44; bottom: 0; left: 0; animation-delay: 0.5s; }
  .b4 { background: #ddaa00; bottom: 0; right: 0; animation-delay: 0.7s; }
  @keyframes appear {
    0%   { opacity: 0; transform: scale(0.2) rotate(-30deg); }
    60%  { opacity: 1; transform: scale(1.15) rotate(6deg); }
    100% { opacity: 1; transform: scale(1) rotate(0deg); }
  }
  .boot-logo { position: absolute; bottom: 18%; left: 50%; transform: translateX(-50%); font-size: 22px; letter-spacing: 6px; opacity: 0; animation: fadein 0.7s ease forwards; animation-delay: 1.4s; font-weight: 300; }
  .boot-logo span { color: #0055aa; font-weight: 700; }
  @keyframes fadein { to { opacity: 1; } }
  #term { position: absolute; inset: 0; display: none; z-index: 2; flex-direction: column; background: transparent; }
  #term.show { display: flex; }
  .header { padding: 12px 18px; border-bottom: 1px solid #00ff41; border: 1px solid #000; background: rgba(0,0,0,0.4); display: flex; justify-content: space-between; font-size: 13px; letter-spacing: 2px; }
  .header .title { color: #00ff41; text-shadow: 0 0 6px #00ff41; }
  .header .sub { color: #00cc33; font-size: 11px; }
  .header select { background: #000; color: #00ff41; border: 1px solid #00cc33; font-family: inherit; font-size: 11px; padding: 2px 4px; letter-spacing: 1px; outline: none; cursor: pointer; }
  .header select:disabled { opacity: 0.6; cursor: not-allowed; }
  #messages { flex: 1; overflow-y: auto; padding: 18px; display: flex; flex-direction: column; gap: 12px; }
  .msg { max-width: 90%; line-height: 1.5; white-space: pre-wrap; word-wrap: break-word; }
  .msg.user { align-self: flex-start; color: #00ff41; border-left: 2px solid #00ff41; padding-left: 10px; }
  .msg.user::before { content: "Neo> "; color: #00ff41; font-weight: bold; }
  .msg.ai { align-self: flex-start; color: #66ff99; border-left: 2px solid #00cc33; padding-left: 10px; }
  .msg.ai::before { content: "Matrix> "; color: #00cc33; font-weight: bold; }
  .msg.sys { color: #00cc33; font-style: italic; font-size: 12px; }
  .inputbar { display: flex; gap: 8px; padding: 12px 18px; border-top: 1px solid #00ff41; background: rgba(0,0,0,0.4); }
  .inputbar textarea { flex: 1; background: #000; color: #00ff41; border: 1px solid #00ff41; padding: 10px; font-family: inherit; font-size: 14px; outline: none; resize: vertical; min-height: 60px; }
  .inputbar textarea:focus { box-shadow: 0 0 8px #00ff41; }
  .inputbar button { background: #00ff41; color: #000; border: none; padding: 10px 18px; font-family: inherit; font-weight: bold; cursor: pointer; }
  .inputbar button:hover { background: #66ff99; }
  .inputbar button:disabled { opacity: 0.5; cursor: not-allowed; }
  .log { position: fixed; bottom: 0; left: 0; right: 0; max-height: 120px; overflow-y: auto; background: rgba(0,0,0,0.7); border-top: 1px solid #f00; color: #f55; font-size: 11px; padding: 6px 10px; z-index: 20; display: none; }
  .log.show { display: block; }
  .hdrbtn { background: none; border: 1px solid #00cc33; color: #00ff41; font-family: inherit; font-size: 10px; letter-spacing: 1px; padding: 2px 6px; cursor: pointer; }
  .hdrbtn:hover { background: rgba(0,255,65,0.12); }
  .ytp { position: fixed; top: 0; right: 0; bottom: 0; width: min(380px, 100vw); background: rgba(0,0,0,0.94); border-left: 1px solid #00ff41; display: flex; flex-direction: column; transform: translateX(101%); transition: transform 0.25s ease; z-index: 30; }
  .ytp.open { transform: translateX(0); }
  .ytp-head { display: flex; justify-content: space-between; align-items: center; padding: 10px 14px; border-bottom: 1px solid #00ff41; color: #00ff41; letter-spacing: 2px; font-size: 12px; }
  .ytp-head button { background: none; border: none; color: #00ff41; font-size: 20px; line-height: 1; cursor: pointer; font-family: inherit; }
  .ytp-form { display: flex; gap: 6px; padding: 10px 14px; border-bottom: 1px solid #00cc33; }
  .ytp-form input { flex: 1; background: #000; color: #00ff41; border: 1px solid #00ff41; padding: 8px; font-family: inherit; font-size: 13px; outline: none; }
  .ytp-form input:focus { box-shadow: 0 0 6px #00ff41; }
  .ytp-form button { background: #00ff41; color: #000; border: none; padding: 8px 12px; font-family: inherit; font-weight: bold; cursor: pointer; }
  .ytp-status { padding: 8px 14px; font-size: 11px; color: #00cc33; min-height: 28px; }
  .ytp-status.err { color: #f55; }
  .ytp-player { width: 100%; aspect-ratio: 16 / 9; background: #000; border-bottom: 1px solid #00cc33; position: relative; flex: 0 0 auto; }
  .ytp-player iframe { width: 100%; height: 100%; border: 0; display: block; }
  .ytp-empty { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: #00cc33; font-size: 11px; letter-spacing: 3px; }
  .ytp-results { flex: 1; overflow-y: auto; }
  .ytp-item { display: flex; gap: 10px; width: 100%; text-align: left; padding: 8px 12px; background: none; border: none; border-bottom: 1px solid rgba(0,255,65,0.15); color: #66ff99; font-family: inherit; cursor: pointer; }
  .ytp-item:hover { background: rgba(0,255,65,0.08); }
  .ytp-item img { width: 88px; height: 50px; object-fit: cover; flex: 0 0 auto; border: 1px solid #00cc33; background: #111; }
  .ytp-item .t { font-size: 12px; line-height: 1.35; color: #00ff41; }
  .ytp-item .meta { font-size: 11px; color: #00cc33; margin-top: 4px; }
  @media (min-width: 900px) { #term { transition: margin-right 0.25s ease; } body.yt-open #term { margin-right: min(380px, 100vw); } }
  @keyframes blink { 50% { opacity: 0; } }
  .cursor::after { content: "▊"; color: #66ff99; animation: blink 1s step-end infinite; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="rain"></canvas>
  <div id="boot">
    <div class="blocks">
      <div class="block b1"></div>
      <div class="block b2"></div>
      <div class="block b3"></div>
      <div class="block b4"></div>
    </div>
    <div class="boot-logo">Matrix</div>
  </div>
  <div id="term">
    <div class="header">
      <div class="title">MATRIX TERMINAL</div>
      <div class="sub">user: Neo  ·  <select id="model" aria-label="Model"></select>  ·  webgpu  ·  <button id="ytToggle" class="hdrbtn" type="button">YOUTUBE</button></div>
    </div>
    <div id="messages"></div>
    <div class="inputbar">
      <textarea id="inp" rows="3" placeholder="type a message... (first send loads the in-browser model)"></textarea>
      <button id="send">SEND</button>
    </div>
  </div>
  <div id="log" class="log"></div>
  <aside id="ytPanel" class="ytp" aria-hidden="true" aria-label="YouTube browser">
    <div class="ytp-head"><span>YOUTUBE BROWSER</span><button id="ytClose" type="button" aria-label="Close YouTube panel">×</button></div>
    <form id="ytForm" class="ytp-form">
      <input id="ytInput" type="search" placeholder="search or paste a link..." autocomplete="off" />
      <button type="submit">GO</button>
    </form>
    <div id="ytStatus" class="ytp-status">search the tube, or paste a video link</div>
    <div class="ytp-player" id="ytPlayer"><div class="ytp-empty">NO SIGNAL</div></div>
    <div id="ytResults" class="ytp-results"></div>
  </aside>
</div>
<script>
  const canvas = document.getElementById('rain');
  const ctx = canvas.getContext('2d');
  let cols, drops;
  function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; cols = Math.floor(canvas.width / 16); drops = Array(cols).fill(1); }
  resize(); window.addEventListener('resize', resize);
  const chars = "アァカサタナハマヤラワ0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ";
  function rain() {
    ctx.fillStyle = "rgba(0,0,0,0.05)"; ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = "#00ff41"; ctx.font = "14px monospace";
    for (let i = 0; i < drops.length; i++) {
      const c = chars[Math.floor(Math.random() * chars.length)];
      ctx.fillText(c, i * 16, drops[i] * 16);
      if (drops[i] * 16 > canvas.height && Math.random() > 0.975) drops[i] = 0;
      drops[i]++;
    }
  }
  setInterval(rain, 45);
  function bootChime() {
    try {
      const ctxa = new (window.AudioContext || window.webkitAudioContext)();
      const notes = [261.63, 329.63, 392.00, 523.25];
      let t = ctxa.currentTime + 0.2;
      notes.forEach((f) => {
        const o = ctxa.createOscillator(); const g = ctxa.createGain();
        o.type = "sine"; o.frequency.value = f;
        g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(0.18, t + 0.05);
        g.gain.exponentialRampToValueAtTime(0.001, t + 1.0);
        o.connect(g).connect(ctxa.destination); o.start(t); o.stop(t + 1.1); t += 0.15;
      });
    } catch (e) {}
  }
  setTimeout(bootChime, 200);
  const boot = document.getElementById('boot');
  const term = document.getElementById('term');
  setTimeout(() => { boot.classList.add('fade'); setTimeout(() => { boot.style.display = 'none'; term.classList.add('show'); addMsg('sys', 'Matrix core offline. Pick a model above, then send a message to boot it — first run downloads that model, then it is cached.'); }, 800); }, 2000);
  const msgs = document.getElementById('messages');
  const inp = document.getElementById('inp');
  const send = document.getElementById('send');
  const history = [];
  // Runs entirely in the browser via WebGPU (no server). Model is cached after first download.
  const MODELS = {
    "Qwen2.5-0.5B-Instruct-q4f16_1-MLC": "Qwen2.5 0.5B · fastest",
    "Qwen2.5-1.5B-Instruct-q4f16_1-MLC": "Qwen2.5 1.5B · balanced",
    "Qwen2.5-3B-Instruct-q4f16_1-MLC": "Qwen2.5 3B · stronger"
  };
  const DEFAULT_MODEL = "Qwen2.5-1.5B-Instruct-q4f16_1-MLC";
  const STORAGE_KEY = "matrix-model";
  const WEBLLM_URL = "https://esm.run/@mlc-ai/web-llm";
  const SYS_PROMPT = "You are Matrix, a helpful AI assistant. Be concise, friendly, helpful. The user is Neo.";
  let modelId = DEFAULT_MODEL;
  let engine = null, enginePromise = null;
  try { const saved = localStorage.getItem(STORAGE_KEY); if (saved && MODELS[saved]) modelId = saved; } catch (e) {}
  const modelSel = document.getElementById('model');
  for (const id of Object.keys(MODELS)) {
    const opt = document.createElement('option');
    opt.value = id; opt.textContent = MODELS[id];
    modelSel.appendChild(opt);
  }
  modelSel.value = modelId;
  modelSel.addEventListener('change', async () => {
    const next = modelSel.value;
    if (!MODELS[next] || next === modelId) return;
    modelId = next;
    try { localStorage.setItem(STORAGE_KEY, modelId); } catch (e) {}
    const old = engine; engine = null; enginePromise = null;
    if (old) { try { await old.unload(); } catch (e) {} }
    addMsg('sys', 'Core set to ' + MODELS[modelId] + '. Send a message to load it (downloads once).');
  });
  function addMsg(role, text) {
    const d = document.createElement('div');
    d.className = 'msg ' + role; d.textContent = text;
    msgs.appendChild(d); msgs.scrollTop = msgs.scrollHeight; return d;
  }
  async function getEngine() {
    if (engine) return engine;
    if (enginePromise) return enginePromise;
    enginePromise = (async () => {
      if (!navigator.gpu) {
        const brave = navigator.brave !== undefined;
        throw new Error(brave
          ? "WebGPU is off because Brave's hardware acceleration is disabled. Open brave://settings/system, enable 'Use graphics acceleration when available', then fully quit and reopen Brave. Check brave://gpu to confirm WebGPU is available."
          : "WebGPU is not available. Enable hardware acceleration in your browser settings, update to Chrome/Edge 113+, and check your browser's GPU page (chrome://gpu) for WebGPU status.");
      }
      addMsg('sys', 'Waking the Matrix core (' + MODELS[modelId] + ')… first run downloads the model, then it is cached in your browser.');
      const progress = addMsg('sys', 'Loading model...');
      const webllm = await import(WEBLLM_URL);
      const eng = await webllm.CreateMLCEngine(modelId, {
        initProgressCallback: (p) => {
          progress.textContent = p.text;
          msgs.scrollTop = msgs.scrollHeight;
        }
      });
      progress.remove();
      engine = eng;
      return eng;
    })();
    try { return await enginePromise; }
    catch (e) { enginePromise = null; throw e; }
  }
  async function sendMsg() {
    const text = inp.value.trim(); if (!text) return;
    inp.value = ''; addMsg('user', text); history.push({ role: 'user', content: text });
    send.disabled = true; modelSel.disabled = true;
    const aiDiv = addMsg('ai', ''); let full = '';
    const cursor = document.createElement('span'); cursor.className = 'cursor'; aiDiv.appendChild(cursor);
    try {
      const eng = await getEngine();
      const stream = await eng.chat.completions.create({
        messages: [{ role: 'system', content: SYS_PROMPT }, ...history],
        stream: true,
        temperature: 0.7
      });
      for await (const chunk of stream) {
        const delta = (chunk.choices && chunk.choices[0] && chunk.choices[0].delta && chunk.choices[0].delta.content) || '';
        if (!delta) continue;
        full += delta; aiDiv.textContent = full; aiDiv.appendChild(cursor); msgs.scrollTop = msgs.scrollHeight;
      }
      if (!full) aiDiv.textContent = '(no response)';
      if (cursor.parentNode === aiDiv) aiDiv.removeChild(cursor);
      history.push({ role: 'assistant', content: full });
    } catch (e) {
      if (cursor.parentNode === aiDiv) aiDiv.removeChild(cursor);
      aiDiv.textContent = '[error: ' + e.message + ']';
      logErr('Chat failed: ' + e.message);
      history.pop();
    } finally { send.disabled = false; modelSel.disabled = false; inp.focus(); }
  }
  send.addEventListener('click', sendMsg);
  inp.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMsg(); } });

  // --- YouTube browser (keyless: Piped / Invidious fallback chain) ---
  const ytPanel = document.getElementById('ytPanel');
  const ytInput = document.getElementById('ytInput');
  const ytStatus = document.getElementById('ytStatus');
  const ytResults = document.getElementById('ytResults');
  const ytPlayer = document.getElementById('ytPlayer');
  const YT_INSTANCES = [
    { type: 'piped', base: 'https://api.piped.private.coffee' },
    { type: 'piped', base: 'https://pipedapi.ducks.party' },
    { type: 'invidious', base: 'https://yt.chocolatemoo53.com' }
  ];
  let lastYtInstance = null, ytDiscovered = false;

  function setYtOpen(open) {
    ytPanel.classList.toggle('open', open);
    ytPanel.setAttribute('aria-hidden', String(!open));
    document.body.classList.toggle('yt-open', open);
    if (open) setTimeout(() => ytInput.focus(), 260);
  }
  document.getElementById('ytToggle').addEventListener('click', () => setYtOpen(!ytPanel.classList.contains('open')));
  document.getElementById('ytClose').addEventListener('click', () => setYtOpen(false));
  window.addEventListener('keydown', (e) => { if (e.key === 'Escape' && ytPanel.classList.contains('open')) setYtOpen(false); });

  function ytSetStatus(text, isErr) {
    ytStatus.textContent = text;
    ytStatus.classList.toggle('err', !!isErr);
  }

  async function ytFetchJson(url, ms) {
    const c = new AbortController();
    const t = setTimeout(() => c.abort(), ms || 9000);
    try {
      const r = await fetch(url, { signal: c.signal });
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return await r.json();
    } finally { clearTimeout(t); }
  }

  function ytParseId(q) {
    const s = q.trim();
    if (/^[A-Za-z0-9_-]{11}$/.test(s)) return s;
    const m = s.match(/(?:[?&]v=|youtu\.be\/|\/embed\/|\/shorts\/)([A-Za-z0-9_-]{11})/);
    return m ? m[1] : null;
  }

  function ytFmtDur(d) {
    if (d == null) return '';
    if (typeof d === 'string' && d.indexOf(':') !== -1) return d;
    const n = Number(d);
    if (!isFinite(n)) return '';
    const h = Math.floor(n / 3600), m = Math.floor((n % 3600) / 60), s = Math.floor(n % 60);
    return (h ? h + ':' + String(m).padStart(2, '0') : m) + ':' + String(s).padStart(2, '0');
  }

  async function ytSearchInstance(inst, q) {
    if (inst.type === 'piped') {
      const j = await ytFetchJson(inst.base + '/search?q=' + encodeURIComponent(q) + '&filter=videos');
      return (j.items || []).map((it) => ({
        id: ((it.url || '').split('v=')[1] || '').slice(0, 11),
        title: it.title,
        author: it.uploaderName,
        thumb: it.thumbnail,
        dur: it.duration
      })).filter((x) => x.id);
    }
    const j = await ytFetchJson(inst.base + '/api/v1/search?q=' + encodeURIComponent(q) + '&type=video');
    return (Array.isArray(j) ? j : []).map((it) => ({
      id: it.videoId,
      title: it.title,
      author: it.author,
      thumb: (it.videoThumbnails && it.videoThumbnails[0] && it.videoThumbnails[0].url) || '',
      dur: it.lengthSeconds
    })).filter((x) => x.id);
  }

  async function ytDiscover() {
    if (ytDiscovered) return;
    ytDiscovered = true;
    try {
      const list = await ytFetchJson('https://api.invidious.io/instances.json?sort_by=health', 8000);
      for (const entry of list) {
        const name = entry[0], info = entry[1];
        if (!info || info.type !== 'https' || !info.api || !info.cors) continue;
        const base = 'https://' + name;
        if (!YT_INSTANCES.some((i) => i.base === base)) YT_INSTANCES.push({ type: 'invidious', base });
      }
    } catch (e) {}
  }

  function ytRender(items) {
    ytResults.replaceChildren();
    for (const it of items.slice(0, 30)) {
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'ytp-item';
      const img = document.createElement('img');
      img.loading = 'lazy'; img.alt = ''; img.src = it.thumb || '';
      img.addEventListener('error', () => { img.style.visibility = 'hidden'; });
      const box = document.createElement('div');
      const t = document.createElement('div');
      t.className = 't'; t.textContent = it.title || '(untitled)';
      const meta = document.createElement('div');
      meta.className = 'meta';
      meta.textContent = [it.author, ytFmtDur(it.dur)].filter(Boolean).join(' · ');
      box.append(t, meta); b.append(img, box);
      b.addEventListener('click', () => ytPlay(it.id, it.title));
      ytResults.appendChild(b);
    }
  }

  function ytPlay(id, title) {
    ytPlayer.replaceChildren();
    const f = document.createElement('iframe');
    f.src = 'https://www.youtube-nocookie.com/embed/' + id + '?autoplay=1&rel=0';
    f.title = title || 'YouTube video';
    f.allow = 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture';
    f.allowFullscreen = true;
    ytPlayer.appendChild(f);
    ytSetStatus('playing: ' + (title || id));
  }

  async function ytSearch(q) {
    const direct = ytParseId(q);
    if (direct) { ytPlay(direct, q); return; }
    ytSetStatus('searching...');
    ytResults.replaceChildren();
    const tried = new Set();
    async function attempt(list) {
      for (const inst of list) {
        if (tried.has(inst.base)) continue;
        tried.add(inst.base);
        try {
          const items = await ytSearchInstance(inst, q);
          if (!items.length) continue;
          lastYtInstance = inst;
          ytRender(items);
          ytSetStatus(items.length + ' results via ' + inst.base.replace('https://', ''));
          return true;
        } catch (e) {}
      }
      return false;
    }
    const ordered = () => {
      const list = YT_INSTANCES.slice();
      if (lastYtInstance) {
        const i = list.findIndex((x) => x.base === lastYtInstance.base);
        if (i > 0) list.unshift(list.splice(i, 1)[0]);
      }
      return list;
    };
    if (await attempt(ordered())) return;
    await ytDiscover();
    if (await attempt(ordered())) return;
    ytSetStatus('no instance responded. try again, or paste a youtu.be link.', true);
  }

  document.getElementById('ytForm').addEventListener('submit', (e) => {
    e.preventDefault();
    const q = ytInput.value.trim();
    if (q) ytSearch(q);
  });
  const logEl = document.getElementById('log');
  function logErr(msg) {
    console.error(msg);
    logEl.classList.add('show');
    const line = document.createElement('div');
    line.textContent = '[' + new Date().toLocaleTimeString() + '] ' + msg;
    logEl.appendChild(line);
    logEl.scrollTop = logEl.scrollHeight;
  }
  window.addEventListener('error', (e) => logErr('Error: ' + (e.message || e) + ' @ ' + (e.filename || '') + ':' + (e.lineno || '')));
  window.addEventListener('unhandledrejection', (e) => logErr('Unhandled rejection: ' + (e.reason && e.reason.message ? e.reason.message : e.reason)));
  // patch fetch error logging in sendMsg catch already calls? add logErr there too
  const _origFetch = window.fetch;
  window.fetch = async (...args) => {
    try { const r = await _origFetch(...args); if (!r.ok) logErr('Fetch ' + args[0] + ' -> HTTP ' + r.status); return r; }
    catch (e) { logErr('Fetch failed: ' + args[0] + ' -> ' + e.message); throw e; }
  };
</script>
</body>
</html>
